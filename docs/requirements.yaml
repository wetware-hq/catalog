# Owner constraints — each row is verified by the listed test(s) or npm run check.
requirements:
  - id: REQ-CLI-001
    title: Terminal-native CLI (rank, list, show, validate, serve)
    tests: [tests/rank-golden.test.ts, tests/validate.test.ts]

  - id: REQ-NO-UI-001
    title: No HTML frontend; JSON HTTP only (3 routes)
    tests: [tests/http.test.ts]

  - id: REQ-HTTP-001
    title: Primitive node:http JSON API with schema-validated rank
    tests: [tests/http.test.ts]

  - id: REQ-A2A-001
    title: A2A AgentCard at /.well-known/agent-card.json
    tests: [tests/http.test.ts]

  - id: REQ-SCHEMA-001
    title: JSON Schemas for registry and rank I/O
    tests: [tests/validate.test.ts, tests/http.test.ts, tests/rank-golden.test.ts]

  - id: REQ-RANK-PURE-001
    title: Pure rank() with golden + reorder/citation properties
    tests: [tests/rank-golden.test.ts, tests/rank-properties.test.ts]

  - id: REQ-EVIDENCE-STATUS-001
    title: verification_status preserved on claims
    tests: [tests/validate.test.ts]

  - id: REQ-EVIDENCE-INTEGRITY-001
    title: Git blob oid sidecar + REFERENCES.md in sync
    check: npm run check

  - id: REQ-SE-001
    title: Systems-engineering artifacts (schemas, requirements, ADRs, architecture)
    tests: [tests/validate.test.ts]
