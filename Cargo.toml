[package]
name = "catalog-agent-organization"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Type-safe agent definitions, organization topology, and Kubernetes action archiving"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
serde_yaml = "0.9.34"
toml = "1.2.1"
