name: validate graph.json
# Runs the verifier (`verifier/verify.py`) on every push/PR touching the paths below: the unit tests, the pure
# predicates, the extension predicates, and the relational add-only check against the previous commit of
# graph.json. The file name is kept as validate.yml so the check name GitHub reports does not move.
on:
  push:
    paths: ["graph.json", "verifier/**", "fleet/**", "skills/**", "systems/**", "**.md", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["graph.json", "verifier/**", "fleet/**", "skills/**", "systems/**", "**.md", ".github/workflows/validate.yml"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # need HEAD~1 for the add-only check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 verifier/tests/test_verify.py
      - name: Fleet tests
        run: python3 fleet/tests/test_fleet.py
      - name: Pure predicates on graph.json
        run: python3 verifier/verify.py graph.json
      - name: Relational add-only vs previous commit
        # Checks the last hop only: HEAD against HEAD~1. A push of several commits is not checked
        # pairwise, so add-only can be violated and repaired inside one push without this failing.
        run: |
          if git cat-file -e HEAD~1:graph.json 2>/dev/null; then
            git show HEAD~1:graph.json > /tmp/prev_graph.json
            python3 verifier/verify.py --prev /tmp/prev_graph.json graph.json
          else
            echo "no predecessor graph.json; skipping 8.19"
          fi
      - name: Extension predicates (E1 banner, E2 skill registry, E4 system registry)
        run: python3 verifier/verify.py graph.json --repo .

  # Separate, NON-BLOCKING job: resolve every pmid via NCBI E-utilities. It needs network and a live third-party
  # service, so it is deliberately kept out of the gating `validate` job and marked continue-on-error: it can never
  # block a merge. The E-utilities check lives behind --online in verifier/verify.py and never changes that tool's exit code.
  online-pmids:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Online pmid resolution (non-blocking)
        run: python3 verifier/verify.py graph.json --online
