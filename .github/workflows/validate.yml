name: validate graph.json
# Ready-to-use workflow. Copy this repo's validator/validate.py + validator/tests/ into the catalog repo (or add this repo as a
# submodule) and this will run the pure predicates on every push/PR, plus the relational add-only check against
# the previous commit of graph.json.
on:
  push:
    paths: ["graph.json", "validator/validate.py", "validator/tests/**", "AGENTS.md", "skills/**"]
  pull_request:
    paths: ["graph.json", "validator/validate.py", "validator/tests/**", "AGENTS.md", "skills/**"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # need HEAD~1 for the add-only check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 validator/tests/test_validate.py
      - name: Pure predicates on graph.json
        run: python3 validator/validate.py graph.json
      - name: Relational add-only vs previous commit
        run: |
          if git cat-file -e HEAD~1:graph.json 2>/dev/null; then
            git show HEAD~1:graph.json > /tmp/prev_graph.json
            python3 validator/validate.py --prev /tmp/prev_graph.json graph.json
          else
            echo "no predecessor graph.json; skipping 8.19"
          fi
      - name: Extension predicates (E1 banner, E2 skill registry)
        run: python3 validator/validate.py graph.json --repo .

  # Separate, NON-BLOCKING job: resolve every pmid via NCBI E-utilities. It needs network and a live third-party
  # service, so it is deliberately kept out of the gating `validate` job and marked continue-on-error: it can never
  # block a merge. The E-utilities check lives behind --online in validator/validate.py and never changes that tool's exit code.
  online-pmids:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Online pmid resolution (non-blocking)
        run: python3 validator/validate.py graph.json --online
