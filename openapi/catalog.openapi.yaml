openapi: 3.1.0
info:
  title: Biomedical Agent Catalog HTTP API
  version: 0.1.0
  description: |
    JSON-only discovery and ranking for A2A peptide specialist agents.
    Implemented by `createApp()` in `src/server/app.ts`. No HTML UI.
    Rank may require x402 v1 payment when `CATALOG_X402_ENABLED=true`.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://127.0.0.1:8787
    description: Local default (`catalog serve`)

security: []

tags:
  - name: discovery
    description: Catalog index and agent cards
  - name: rank
    description: Patient-context agent ranking (optional x402)
  - name: a2a
    description: JSON-RPC 2.0 shim for agent interoperability
  - name: ops
    description: Health

paths:
  /.well-known/agent-card.json:
    get:
      tags: [discovery]
      operationId: getCatalogAgentCard
      summary: Catalog A2A AgentCard
      parameters:
        - $ref: "#/components/parameters/AcceptJson"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: AgentCard document
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "../schemas/a2a-agent-card.schema.json"
        "304":
          description: Not modified
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /catalog/v1/index:
    get:
      tags: [discovery]
      operationId: getCatalogIndex
      summary: Catalog index and link map
      parameters:
        - $ref: "#/components/parameters/AcceptJson"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Index metadata
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogIndex"
        "304":
          description: Not modified
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /catalog/v1/domains:
    get:
      tags: [discovery]
      operationId: listDomains
      summary: List catalog domains
      parameters:
        - $ref: "#/components/parameters/AcceptJson"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Domain collection
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainList"
        "304":
          description: Not modified
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /catalog/v1/domains/{domainId}/agents:
    get:
      tags: [discovery]
      operationId: listDomainAgents
      summary: Agent cards in a domain
      parameters:
        - $ref: "#/components/parameters/AcceptJson"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: domainId
          in: path
          required: true
          schema:
            type: string
            example: peptides
      responses:
        "200":
          description: Agents in domain
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainAgents"
        "304":
          description: Not modified
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /catalog/v1/agents/{registryId}:
    get:
      tags: [discovery]
      operationId: getRegistryEntry
      summary: Full catalog registry entry
      parameters:
        - $ref: "#/components/parameters/AcceptJson"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: registryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Registry entry
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "../schemas/catalog-registry-entry.schema.json"
        "304":
          description: Not modified
        "404":
          description: Unknown registry id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /catalog/v1/rank:
    post:
      tags: [rank]
      operationId: rankAgents
      summary: Rank agents for patient context
      description: |
        When x402 is enabled, unpaid or invalid payment returns **402** with
        `PaymentRequiredResponse` in the body and optional `X-PAYMENT-RESPONSE`
        (base64 JSON). Successful payment retry uses `X-PAYMENT` (base64 JSON).
      parameters:
        - $ref: "#/components/parameters/AcceptJson"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: X-PAYMENT
          in: header
          required: false
          description: Base64-encoded x402 v1 PaymentPayload
          schema:
            type: string
      responses:
        "200":
          description: Ranked agents
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Link:
              $ref: "#/components/headers/Link"
            X-PAYMENT-RESPONSE:
              $ref: "#/components/headers/XPaymentResponse"
          content:
            application/json:
              schema:
                $ref: "../schemas/rank-response.schema.json"
        "400":
          description: Invalid body or payment header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "402":
          description: Payment required or verification/settlement failed
          headers:
            X-PAYMENT-RESPONSE:
              $ref: "#/components/headers/XPaymentResponse"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequiredResponse"
        "406":
          $ref: "#/components/responses/NotAcceptable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/rank-request.schema.json"

  /a2a/v1:
    post:
      tags: [a2a]
      operationId: a2aJsonRpc
      summary: JSON-RPC 2.0 catalog methods
      description: |
        Supported methods: `catalog/list`, `catalog/rank`.
        x402 is **not** applied on this path (only `POST /catalog/v1/rank`).
      parameters:
        - $ref: "#/components/parameters/AcceptJson"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
      responses:
        "200":
          description: JSON-RPC response (success or error object)
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "400":
          description: Invalid JSON-RPC envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "406":
          $ref: "#/components/responses/NotAcceptable"

  /health:
    get:
      tags: [ops]
      operationId: health
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true

components:
  parameters:
    AcceptJson:
      name: Accept
      in: header
      required: false
      description: Must include `application/json` or `*/*`; otherwise **406**.
      schema:
        type: string
        default: application/json
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string

  headers:
    ETag:
      description: SHA-256 digest of response body (16 hex chars)
      schema:
        type: string
    CacheControl:
      description: public, max-age=…
      schema:
        type: string
    Link:
      description: RFC 8288 Link relations
      schema:
        type: string
    XPaymentResponse:
      description: Base64-encoded x402 SettlementResponse
      schema:
        type: string

  responses:
    NotAcceptable:
      description: Unsupported Accept header
      content:
        text/plain:
          schema:
            type: string
            example: Not Acceptable

  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: string
      required: [error]

    CatalogIndex:
      type: object
      required: [name, version, domains, links, x402]
      properties:
        name:
          type: string
        version:
          type: string
        domains:
          type: array
          items:
            type: string
        links:
          type: object
          additionalProperties:
            type: string
            format: uri
        x402:
          type: object
          required: [enabled, paidOperations]
          properties:
            enabled:
              type: boolean
            paidOperations:
              type: array
              items:
                type: string

    DomainList:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items:
            type: object
            required: [domainId, agentCount, href]
            properties:
              domainId:
                type: string
              agentCount:
                type: integer
              href:
                type: string
                format: uri

    DomainAgents:
      type: object
      required: [domainId, agents]
      properties:
        domainId:
          type: string
        agents:
          type: array
          items:
            type: object
            required: [registryId, agentCard, href]
            properties:
              registryId:
                type: string
              agentCard:
                $ref: "../schemas/a2a-agent-card.schema.json"
              href:
                type: string
                format: uri

    PaymentRequirements:
      type: object
      required:
        - scheme
        - network
        - maxAmountRequired
        - resource
        - description
        - payTo
        - maxTimeoutSeconds
        - asset
      properties:
        scheme:
          type: string
        network:
          type: string
        maxAmountRequired:
          type: string
        resource:
          type: string
          format: uri
        description:
          type: string
        mimeType:
          type: string
        outputSchema:
          type: ["object", "null"]
        payTo:
          type: string
        maxTimeoutSeconds:
          type: integer
        asset:
          type: string
        extra:
          type: ["object", "null"]

    PaymentRequiredResponse:
      type: object
      required: [x402Version, error, accepts]
      properties:
        x402Version:
          type: integer
          const: 1
        error:
          type: string
        accepts:
          type: array
          items:
            $ref: "#/components/schemas/PaymentRequirements"

    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: string
            - type: number
            - type: "null"
        method:
          type: string
          enum: [catalog/list, catalog/rank]
        params:
          type: object

    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: string
            - type: number
            - type: "null"
        result:
          type: object
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string

externalDocs:
  description: x402 v1 HTTP transport (402 payment-required responses on POST /catalog/v1/rank)
  url: https://github.com/coinbase/x402/blob/main/specs/transports-v1/http.md

x-references:
  - id: "1"
    title: Agent2Agent (A2A) Protocol
    url: https://github.com/a2aproject/A2A/blob/main/docs/specification.md
  - id: "2"
    title: x402 v1 HTTP transport
    url: https://github.com/coinbase/x402/blob/main/specs/transports-v1/http.md
  - id: "3"
    title: JSON-RPC 2.0 Specification
    url: https://www.jsonrpc.org/specification
  - id: "4"
    title: OpenAPI Specification v3.1.0
    url: https://spec.openapis.org/oas/v3.1.0/draft
  - id: "5"
    title: JSON Schema draft 2020-12 (rank/registry component schemas)
    url: https://json-schema.org/draft/2020-12/json-schema-core
  - id: "6"
    title: RFC 9110 — HTTP Semantics (ETag, Cache-Control)
    url: https://www.rfc-editor.org/rfc/rfc9110
