apiVersion: v1
kind: Namespace
metadata:
  name: catalog-agents
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-agent-organization
  namespace: catalog-agents
data:
  organization.json: |
    {
      "name": "agent_swarm",
      "shape": "dag",
      "sink": "literals",
      "nodes": [
        "bytes",
        "grammar",
        "identity",
        "relation",
        "oracle",
        "document",
        "trace",
        "decide",
        "literals"
      ],
      "edges": [
        {"from": "bytes", "to": "decide"},
        {"from": "grammar", "to": "decide"},
        {"from": "identity", "to": "decide"},
        {"from": "relation", "to": "decide"},
        {"from": "oracle", "to": "decide"},
        {"from": "document", "to": "decide"},
        {"from": "trace", "to": "decide"},
        {"from": "decide", "to": "literals"},
        {"from": "document", "to": "literals"}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-agent-organization
  namespace: catalog-agents
  labels:
    app.kubernetes.io/name: catalog-agent
    catalog.agent/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-agent
      catalog.agent/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-agent
        catalog.agent/component: agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bytes
          image: ghcr.io/wetware-hq/catalog-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--heartbeat-seconds", "60"]
          env:
            - name: AGENT_ID
              value: "bytes"
          resources: &agent-resources
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext: &agent-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: grammar
          image: ghcr.io/wetware-hq/catalog-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--heartbeat-seconds", "60"]
          env:
            - name: AGENT_ID
              value: "grammar"
          resources: *agent-resources
          securityContext: *agent-security
        - name: identity
          image: ghcr.io/wetware-hq/catalog-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--heartbeat-seconds", "60"]
          env:
            - name: AGENT_ID
              value: "identity"
          resources: *agent-resources
          securityContext: *agent-security
        - name: relation
          image: ghcr.io/wetware-hq/catalog-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--heartbeat-seconds", "60"]
          env:
            - name: AGENT_ID
              value: "relation"
          resources: *agent-resources
          securityContext: *agent-security
        - name: oracle
          image: ghcr.io/wetware-hq/catalog-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--heartbeat-seconds", "60"]
          env:
            - name: AGENT_ID
              value: "oracle"
          resources: *agent-resources
          securityContext: *agent-security
        - name: document
          image: ghcr.io/wetware-hq/catalog-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--heartbeat-seconds", "60"]
          env:
            - name: AGENT_ID
              value: "document"
          resources: *agent-resources
          securityContext: *agent-security
        - name: trace
          image: ghcr.io/wetware-hq/catalog-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--heartbeat-seconds", "60"]
          env:
            - name: AGENT_ID
              value: "trace"
          resources: *agent-resources
          securityContext: *agent-security
        - name: decide
          image: ghcr.io/wetware-hq/catalog-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--heartbeat-seconds", "60"]
          env:
            - name: AGENT_ID
              value: "decide"
          resources: *agent-resources
          securityContext: *agent-security
        - name: literals
          image: ghcr.io/wetware-hq/catalog-agent:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--heartbeat-seconds", "60"]
          env:
            - name: AGENT_ID
              value: "literals"
          resources: *agent-resources
          securityContext: *agent-security
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-tracer
  namespace: catalog-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: catalog-tracer
  namespace: catalog-agents
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: catalog-tracer
  namespace: catalog-agents
subjects:
  - kind: ServiceAccount
    name: catalog-tracer
    namespace: catalog-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: catalog-tracer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog-agent-archive
  namespace: catalog-agents
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-tracer
  namespace: catalog-agents
  labels:
    app.kubernetes.io/name: catalog-tracer
    catalog.agent/component: tracer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-tracer
      catalog.agent/component: tracer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-tracer
        catalog.agent/component: tracer
    spec:
      serviceAccountName: catalog-tracer
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tracer
          image: ghcr.io/wetware-hq/catalog-tracer:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - "--jsonl"
            - "/archive/actions.jsonl"
            - "--sql"
            - "/archive/actions.sql"
            - "--skip-invalid"
            - "kubernetes"
            - "--namespace"
            - "catalog-agents"
            - "--selector"
            - "catalog.agent/component=agent"
            - "--follow"
          volumeMounts:
            - name: archive
              mountPath: /archive
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: catalog-agent-archive
